runtime: "nodejs20"

# Secret mappings for production
# Public variables (NEXT_PUBLIC_*) should be added in the Firebase Console
env:
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: SENDGRID_API_KEY
    secret: SENDGRID_API_KEY
  - variable: SENDGRID_FROM_EMAIL
    value: "foundation@wrsa.co.za"
  - variable: SENDGRID_FROM_NAME
    value: "WRSA Foundation"
  - variable: ADMIN_EMAIL
    value: "foundation@wrsa.co.za,marketing@saturnmanagement.co.za"
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://wrsafoundation--wrsafoundation.europe-west4.hosted.app"
  - variable: BANK_NAME
    value: "ABSA"
  - variable: BANK_ACCOUNT_NAME
    value: "WRSA Foundation NPC"
  - variable: BANK_ACCOUNT_NUMBER
    value: "4103196934"
  - variable: BANK_ACCOUNT_TYPE
    value: "Classic Business Cheque Account"
  - variable: BANK_BRANCH_CODE
    value: "632005"

# Build settings
scripts:
  build: "npm run build"
  start: "npm run start"
